<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder - Post a Job</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo"><span>J</span> JobFinder</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Find a Job</a></li>
                    <li><a href="companies.html">Companies</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
            <a href="post-job.html" class="btn-post active">Post a Job</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="container">
                <h1>Post a Job</h1>
                <p>Reach thousands of qualified candidates.</p>
            </div>
        </div>
        <div class="container">
            <div class="form-container">
                <!-- Requirement: HTML Form -->
                <form action="#">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" placeholder="e.g. Senior Product Manager" required>
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" placeholder="e.g. Google" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" placeholder="e.g. Almaty or Remote" required>
                    </div>
                    <div class="form-group">
                        <label>Job Description</label>
                        <textarea rows="5" placeholder="Describe responsibilities..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Publish Job</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div>
                <div class="footer-logo">JobFinder</div>
                <p>We connect the best talent with top companies.</p>
            </div>
            <div>
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="jobs.html">Browse Jobs</a></li>
                </ul>
            </div>
            <div>
                <h4>Employers</h4>
                <ul>
                    <li><a href="post-job.html">Post a Job</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 JobFinder. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
